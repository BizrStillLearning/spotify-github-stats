      .dot-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </defs>

  <rect width="420" height="116" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1" />

  <image href="data:image/jpeg;base64," x="14" y="14" width="88" height="88" clip-path="url(#albumClip)" preserveAspectRatio="xMidYMid slice" />
  <rect x="14" y="14" width="88" height="88" rx="10" fill="none" stroke="#27272a" stroke-width="1" />

  <circle cx="118" cy="25" r="4" fill="#10b981" class="dot-pulse" />
