name: Update Spotify Stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Environment Variables
        run: |
          if [ -z "${{ secrets.LASTFM_API_KEY }}" ] || [ -z "${{ secrets.LASTFM_USERNAME }}" ]; then
            echo "::error::LASTFM_API_KEY atau LASTFM_USERNAME belum diatur di Settings -> Secrets -> Actions!"
            exit 1
          fi

      - name: Generate Spotify & Top Albums Cards
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        run: npm run start

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f dist/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(spotify): auto-update stats and top albums [skip ci]"
            git push origin main
          else
            echo "Tidak ada perubahan trek/album, melewati commit."
          fi